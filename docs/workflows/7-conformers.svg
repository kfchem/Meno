 a compound set: each entry a compound of its own. A conformer set - entries grouped by the compound</text><text x="20" y="266" font-size="11.5" fill="#59636e" text-anchor="start" font-weight="normal">they are conformers of (a, b) - is made by the flow only: by Conformers, as here, or by As conformers, a step of its own. Steps</text><text x="20" y="282" font-size="11.5" fill="#59636e" text-anchor="start" font-weight="normal">work entry by entry, or compound by compound; what a filter sets aside is kept, struck through, not deleted.</text><text x="580.0" y="314" font-size="12" fill="#59636e" text-anchor="middle" font-weight="normal">Figure 7. Conformers through a workflow, as ACCeL takes them: a box of entries, by compound, step after step</text></svg>
