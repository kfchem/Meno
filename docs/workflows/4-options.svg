<svg xmlns="http://www.w3.org/2000/svg" width="800" height="370" viewBox="0 0 800 370" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif"><title>A step's options</title><rect width="800" height="370" fill="#ffffff"/><rect x="200" y="30" width="330" height="300" rx="14" fill="#fff" stroke="#1e90ff" stroke-width="1.4"/><path d="M215.0,49.0 Q221.0,65.0 225.0,62.0 T233.0,52.0" fill="none" stroke="#1f2328" stroke-width="1.7" stroke-linecap="round"/><circle cx="224.5" cy="62.0" r="2.2" fill="#1f2328"/><text x="244" y="61" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">Optimise</text><text x="244" y="79" font-size="11.5" fill="#59636e" text-anchor="start" font-weight="normal">xTB 6.7.1</text><line x1="214" y1="92" x2="516" y2="92" stroke="#d1d9e0"/><text x="216" y="114" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">Method</text><rect x="216" y="121" width="70.8" height="22" rx="6" fill="#317689" stroke="#d1d9e0"/><text x="251.4" y="136" font-size="11" fill="#fff" text-anchor="middle" font-weight="normal">GFN2-xTB</text><rect x="291.8" y="121" width="70.8" height="22" rx="6" fill="#fff" stroke="#d1d9e0"/><text x="327.2" y="136" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">GFN1-xTB</text><rect x="367.6" y="121" width="57.599999999999994" height="22" rx="6" fill="#fff" stroke="#d1d9e0"/><text x="396.40000000000003" y="136" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">GFN-FF</text><text x="216" y="162" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">Solvent</text><rect x="216" y="169" width="44.4" height="22" rx="6" fill="#317689" stroke="#d1d9e0"/><text x="238.2" y="184" font-size="11" fill="#fff" text-anchor="middle" font-weight="normal">none</text><rect x="265.4" y="169" width="51.0" height="22" rx="6" fill="#fff" stroke="#d1d9e0"/><text x="290.9" y="184" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">water</text><rect x="321.4" y="169" width="70.8" height="22" rx="6" fill="#fff" stroke="#d1d9e0"/><text x="356.79999999999995" y="184" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">methanol</text><rect x="397.2" y="169" width="24.6" height="22" rx="6" fill="#fff" stroke="#d1d9e0"/><text x="409.5" y="184" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">…</text><text x="216" y="210" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">Optimisation level</text><rect x="216" y="217" width="57.599999999999994" height="22" rx="6" fill="#fff" stroke="#d1d9e0"/><text x="244.8" y="232" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">normal</text><rect x="278.6" y="217" width="51.0" height="22" rx="6" fill="#317689" stroke="#d1d9e0"/><text x="304.1" y="232" font-size="11" fill="#fff" text-anchor="middle" font-weight="normal">tight</text><rect x="334.6" y="217" width="84.0" height="22" rx="6" fill="#fff" stroke="#d1d9e0"/><text x="376.6" y="232" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">very tight</text><text x="216" y="258" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">Charge</text><rect x="216" y="265" width="56" height="22" rx="6" fill="#fff" stroke="#d1d9e0"/><text x="230" y="280" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="normal">0</text><text x="310" y="258" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">Unpaired electrons</text><rect x="310" y="265" width="56" height="22" rx="6" fill="#fff" stroke="#d1d9e0"/><text x="324" y="280" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="normal">0</text><line x1="214" y1="292" x2="516" y2="292" stroke="#d1d9e0"/><text x="216" y="314" font-size="11.5" fill="#59636e" text-anchor="start" font-weight="normal">Ready</text><circle cx="200" cy="180" r="5.5" fill="#ffffff" stroke="#8c959f" stroke-width="1.6"/><circle cx="530" cy="180" r="5.5" fill="#ffffff" stroke="#8c959f" stroke-width="1.6"/><text x="560" y="80" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">Clicked, a step opens to its options -</text><text x="560" y="96" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">the plugin's own, drawn in Meno's</text><text x="560" y="112" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">general form - and who runs it.</text><text x="560" y="144" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">Charge and unpaired electrons are</text><text x="560" y="160" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">read from the input as Export does.</text><text x="560" y="192" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">A change after a run marks it</text><text x="560" y="208" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">Changed; its results stay, dimmed.</text><text x="400.0" y="352" font-size="12" fill="#59636e" text-anchor="middle" font-weight="normal">Figure 4. A step opened to its options</text></svg>
