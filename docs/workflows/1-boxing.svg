<svg xmlns="http://www.w3.org/2000/svg" width="800" height="310" viewBox="0 0 800 310" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif"><title>Boxing a molecule as an input</title><rect width="800" height="310" fill="#ffffff"/><line x1="150.0" y1="172.0" x2="130.9" y2="161.0" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round"/><line x1="148.2" y1="166.1" x2="136.9" y2="159.6" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round"/><line x1="130.9" y1="161.0" x2="130.9" y2="139.0" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round"/><line x1="130.9" y1="139.0" x2="150.0" y2="128.0" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round"/><line x1="136.9" y1="140.4" x2="148.2" y2="133.9" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round"/><line x1="150.0" y1="128.0" x2="169.1" y2="139.0" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round"/><line x1="169.1" y1="139.0" x2="169.1" y2="161.0" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round"/><line x1="164.9" y1="143.5" x2="164.9" y2="156.5" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round"/><line x1="169.1" y1="161.0" x2="150.0" y2="172.0" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round"/><line x1="169.1" y1="139.0" x2="188.1" y2="128.0" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round"/><line x1="188.1" y1="128.0" x2="185.1" y2="110.0" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round"/><line x1="191.1" y1="128.0" x2="191.1" y2="110.0" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round"/><line x1="188.1" y1="128.0" x2="202.2" y2="136.0" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round"/><line x1="213.2" y1="136.0" x2="226.2" y2="128.0" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round"/><text x="188.10511776651532" y="105.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">O</text><text x="208.15767664977298" y="144.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">O</text><rect x="78" y="96" width="190" height="104" rx="4" fill="#1e90ff" fill-opacity="0.07" stroke="#1e90ff" stroke-width="1.2" stroke-dasharray="5 4"/><circle cx="268" cy="148" r="5.5" fill="#1e90ff" stroke="#1e90ff" stroke-width="1.6"/><path d="M268,148 C344.0,148 344.0,190 420,190" fill="none" stroke="#1e90ff" stroke-width="1.6" stroke-dasharray="2 4" stroke-linecap="round"/><path d="M418,186 l0,17 l4.5,-4 l3.2,7 l2.6,-1.2 l-3.1,-6.8 l6,-0.4 z" fill="#111" stroke="#fff" stroke-width="1.1" stroke-linejoin="round"/><text x="470" y="120" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="normal">1  A long press on empty space and a drag</text><text x="486" y="138" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">boxes the structure, as a selection does today.</text><text x="470" y="166" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="normal">2  A port shows on the box's right edge.</text><text x="486" y="184" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">Pulled out, the box stays as the workflow's input,</text><text x="486" y="200" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">and a wire follows the pointer.</text><text x="470" y="228" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="normal">3  Let go on empty space: Quick Add, its steps that</text><text x="486" y="246" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">take molecules. Let go on a step's port: wired to it.</text><text x="400.0" y="292" font-size="12" fill="#59636e" text-anchor="middle" font-weight="normal">Figure 1. An input, boxed and pulled out of a selection</text></svg>
