# The CREST plugin's environment, made by pixi from the lock beside this
# file - every package pinned by its hash - when the plugin is added in
# Settings, Plugins (docs/PLUGINS.md, docs/WORKFLOWS.md). CREST, the xtb
# it runs, and Python come from conda-forge, which has CREST for macOS and
# Linux only: on Windows the plugin cannot be added (its manifest's
# `systems`). CREST 2.12, not 3.0.2: conda-forge's 3.0.2 for macOS keeps
# only the lowest conformer whatever energy window it is given
# (github.com/crest-lab/crest/issues/431), and one version on both systems
# finds the same conformers.
[workspace]
name = "meno-plugin-crest"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = "3.12.*"
crest = "==2.12"
xtb = "==6.7.1"
