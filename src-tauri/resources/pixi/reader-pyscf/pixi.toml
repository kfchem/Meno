# The PySCF reader plugin's environment (src/lib/calc/catalog.ts), made by
# pixi from the lock beside this file - every package pinned by its hash -
# when the reader is added in Settings, Calculation readers. PySCF and its
# libraries come from conda-forge, which has them for Windows too; cclib,
# which reads the programs' output for it, from PyPI.
[workspace]
name = "meno-reader-pyscf"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "win-64", "linux-64"]

[dependencies]
python = "3.12.*"
pyscf = "==2.14.0"
numpy = ">=1.26"
scipy = "*"

[pypi-dependencies]
cclib = "==1.9rc1"
